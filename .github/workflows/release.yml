# Attaches the packaged plugin to the GitHub release
name: Release
on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
    package:
        name: Package
        uses: ./.github/workflows/package.yml
        secrets: inherit
        with:
          version: ${{ github.event.release.tag_name }}

    release:
        name: Release
        runs-on: ubuntu-latest
        needs: package
        permissions:
            contents: write
        environment: prod
        steps:
            # Check out current repository
            - name: Fetch Sources
              uses: actions/checkout@v4

            - name: Download VSIX artifact
              uses: actions/download-artifact@v4
              with:
                  name: data-bridge-${{ github.event.release.tag_name }}.vsix
                  path: .

            - uses: pnpm/action-setup@v4
            
            - uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Strip v from version
              id: strip-v
              shell: bash
              run: |
                TAG=${{ github.event.release.tag_name }}
                echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

            # To publish to Open VSX like scorpio: register this repository as a trusted publisher for
            # tum-aet.data-bridge on open-vsx.org, add `id-token: write` to this job and run
            # `npx ovsx@1.3.0 publish --trusted-publishing ./data-bridge-${{ steps.strip-v.outputs.VERSION }}.vsix`.

            # Upload artifact as a release asset
            - name: Upload Release Asset
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload --clobber ${{ github.event.release.tag_name }} ./data-bridge-${{ steps.strip-v.outputs.VERSION }}.vsix

