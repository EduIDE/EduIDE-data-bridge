# Manual release. The only way data-bridge releases.
#
#   gh workflow run release.yml -R EduIDE/EduIDE-data-bridge --ref main -f version=0.0.18
#   gh workflow run release.yml -R EduIDE/EduIDE-data-bridge --ref my-branch -f version=0.0.18-rc.1
#
# The vsix is attached to the GitHub Release. A release candidate (-rc.N) makes
# a prerelease. Nothing is published to a registry.
#
# A release created with GITHUB_TOKEN triggers no other workflow, so the
# packaging is called from here instead of being triggered by the release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.0.18, or 0.0.18-rc.1 for a prerelease"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    name: Package
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}

  release:
    name: Tag and GitHub Release
    needs: package
    permissions:
      contents: write
    uses: EduIDE/.github/.github/workflows/release.yml@main
    with:
      version: ${{ inputs.version }}
      tag_prefix: "v"
      version_check: |
        case "$VERSION" in *-rc.*) exit 0 ;; esac
        got=$(jq -r .version package.json)
        [ "$got" = "$VERSION" ] || { echo "package.json says $got, expected $VERSION. Bump it in the release pull request."; exit 1; }

  assets:
    name: Attach vsix
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: data-bridge-${{ inputs.version }}.vsix
          path: .

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "./data-bridge-${{ inputs.version }}.vsix" --repo "$GITHUB_REPOSITORY"

  verify:
    name: Verify
    needs: [release, assets]
    runs-on: ubuntu-latest
    steps:
      - name: Check the published asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "data-bridge-${VERSION}.vsix"
          echo "## Released ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
