# Manual release. The only way data-bridge releases.
#
#   gh workflow run release.yml -R EduIDE/EduIDE-data-bridge --ref main -f version=0.0.18
#   gh workflow run release.yml -R EduIDE/EduIDE-data-bridge --ref my-branch -f version=0.0.18-rc.1
#
# The vsix is attached to the GitHub Release. A release candidate (-rc.N) makes
# a prerelease. Nothing is published to a registry.
#
# A release created with GITHUB_TOKEN triggers no other workflow, so the
# packaging is called from here instead of being triggered by the release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.0.18, or 0.0.18-rc.1 for a prerelease"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Draft GitHub Release
    permissions:
      contents: write
    uses: EduIDE/.github/.github/workflows/release.yml@main
    with:
      version: ${{ inputs.version }}
      tag_prefix: "v"

  package:
    name: Package
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}

  assets:
    name: Attach vsix
    needs: [release, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: data-bridge-${{ inputs.version }}.vsix
          path: .

      # The release is still a draft here, so --clobber only makes a rerun work.
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --clobber "./data-bridge-${{ inputs.version }}.vsix"

  verify:
    name: Verify
    needs: [release, assets]
    runs-on: ubuntu-latest
    steps:
      - name: Check the published asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "data-bridge-${VERSION}.vsix"
          echo "## Released ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

  # Last: publishing the draft creates the tag. Until here a failed job leaves
  # a draft and no tag.
  publish-release:
    needs: [release, verify]
    permissions:
      contents: write
    uses: EduIDE/.github/.github/workflows/release-publish.yml@main
    with:
      tag: ${{ needs.release.outputs.tag }}
