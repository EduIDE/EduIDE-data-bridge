name: Build & Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm run ts:check

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # vscode-test launches a real VS Code instance, which needs a display on Linux.
      - name: Test
        run: xvfb-run -a pnpm run test

